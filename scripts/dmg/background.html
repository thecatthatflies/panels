<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Sans"; src: url("../../Panels/Resources/Fonts/InstrumentSans-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("../../Panels/Resources/Fonts/InstrumentSans-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body { position: relative; font-family: "Instrument Sans", sans-serif; color: #1e2b2a;
    background: radial-gradient(520px 300px at 50% -10%, #f4f8fb 0%, rgba(244,248,251,0) 70%), linear-gradient(180deg, #d3e0ec 0%, #c5d5e4 100%); }
  .slab { position: absolute; border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px -20px rgba(30,43,42,.35); opacity: .9; }
  .s1 { left: -34px; bottom: -40px; width: 120px; height: 96px; background: linear-gradient(150deg,#78989a,#466362); transform: rotate(-6deg); }
  .s2 { left: 70px; bottom: -58px; width: 90px; height: 70px; background: linear-gradient(150deg,#a58a73,#7e6551); transform: rotate(4deg); }
  .s3 { right: -30px; bottom: -44px; width: 150px; height: 100px; background: linear-gradient(150deg,#b9a7a2,#938581); transform: rotate(5deg); }
  .s4 { right: 96px; bottom: -62px; width: 110px; height: 70px; background: linear-gradient(150deg,#a9b6c8,#8896ab); transform: rotate(-4deg); }
  h1 { position: absolute; top: 34px; left: 0; right: 0; margin: 0; text-align: center; font-size: 25px; font-weight: 700; letter-spacing: -0.03em; }
  p { position: absolute; top: 72px; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; color: #466362; }
  svg { position: absolute; left: 0; top: 0; }
  .foot { top: auto; bottom: 16px; font-size: 11px; color: #466362; opacity: .9; }
</style>
</head>
<body>
  <div class="slab s1"></div><div class="slab s2"></div><div class="slab s3"></div><div class="slab s4"></div>
  <h1>Drag Panels to Applications</h1>
  <p>Then open it from your Applications folder.</p>
  <svg width="660" height="400" viewBox="0 0 660 400" fill="none">
    <path d="M262 190 C 300 160, 360 160, 398 190" stroke="#466362" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" />
    <path d="M388 178 L402 192 L384 198" stroke="#466362" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <p class="foot">Requires macOS 26 or newer</p>
</body>
</html>
