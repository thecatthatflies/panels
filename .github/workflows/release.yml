name: Release

# Every push to main builds Panels and publishes a GitHub release containing Panels.zip.
# Installed copies of the app poll the latest release and update themselves.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compute version
        id: version
        run: |
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "marketing=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -project Panels.xcodeproj \
            -scheme Panels \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.number }}" \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Self test
        run: scripts/selftest.sh build/Build/Products/Release/Panels.app

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Panels.app Panels.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.marketing }}" Panels.zip \
            --title "Panels ${{ steps.version.outputs.marketing }}" \
            --generate-notes \
            --latest
