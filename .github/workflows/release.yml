name: Release

# Every push to main builds Panels and publishes a GitHub release containing Panels.dmg.
# The website and the in-app updater both download that disk image.
# Versions start at 1.0.0 and the patch number goes up by one per release.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # next patch after the latest release, or 1.0.0 when there is none
          LAST="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$LAST" ]; then
            NEXT="1.0.0"
          else
            IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
            NEXT="${MAJ}.${MIN}.$(( ${PAT:-0} + 1 ))"
          fi
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "marketing=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -project Panels.xcodeproj \
            -scheme Panels \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.number }}" \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Self test
        run: scripts/selftest.sh build/Build/Products/Release/Panels.app

      - name: Package
        run: |
          scripts/make-dmg.sh build/Build/Products/Release/Panels.app Panels.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.marketing }}" Panels.dmg \
            --title "Panels ${{ steps.version.outputs.marketing }}" \
            --generate-notes \
            --latest
